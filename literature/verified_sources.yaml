  - id: bunet
    title: BU-Net - Brain Tumor Segmentation Using Modified U-Net Architecture
    authors: Rehman et al.
    venue: Electronics
    year: 2020
    doi: 10.3390/electronics9122203
    url: https://doi.org/10.3390/electronics9122203
    verified_claims:
      - Residual extended skip and wide context modules were introduced as BU-Net components.
      - BU-Net is a two-dimensional modified U-Net.
