sources:
  - id: brats2020_data
    title: Multimodal Brain Tumor Segmentation Challenge 2020 - Data
    organization: Center for Biomedical Image Computing and Analytics, University of Pennsylvania
    url: https://www.med.upenn.edu/cbica/brats2020/data.html
    verified_claims:
      - BraTS 2020 provides T1, post-contrast T1, T2, and FLAIR MRI.
      - Images are co-registered, resampled to 1 mm isotropic resolution, and skull stripped.
      - Training labels use 1, 2, and 4 for the annotated tumor subregions.
    use: Dataset description only.

  - id: brats2020_tasks
    title: Multimodal Brain Tumor Segmentation Challenge 2020 - Tasks
    organization: Center for Biomedical Image Computing and Analytics, University of Pennsylvania
    url: https://www.med.upenn.edu/cbica/brats2020/tasks.html
    verified_claims:
      - BraTS evaluates whole tumor, tumor core, and enhancing tumor regions.
      - Dice and 95th-percentile Hausdorff distance are official challenge metrics.
    use: Region and metric definitions only.

  - id: menze2015
    title: The Multimodal Brain Tumor Image Segmentation Benchmark (BRATS)
    authors: Menze et al.
    venue: IEEE Transactions on Medical Imaging
    year: 2015
    doi: 10.1109/TMI.2014.2377694
    url: https://doi.org/10.1109/TMI.2014.2377694
    use: BraTS benchmark history.

  - id: bakas2017
    title: Advancing The Cancer Genome Atlas glioma MRI collections with expert segmentation labels and radiomic features
    authors: Bakas et al.
    venue: Scientific Data
    year: 2017
    doi: 10.1038/sdata.2017.117
    url: https://doi.org/10.1038/sdata.2017.117
    use: BraTS annotation and imaging context.

  - id: bakas2018
    title: Identifying the Best Machine Learning Algorithms for Brain Tumor Segmentation, Progression Assessment, and Overall Survival Prediction in the BRATS Challenge
    authors: Bakas et al.
    year: 2018
    url: https://arxiv.org/abs/1811.02629
    use: Challenge context.

  - id: unet
    title: U-Net - Convolutional Networks for Biomedical Image Segmentation
