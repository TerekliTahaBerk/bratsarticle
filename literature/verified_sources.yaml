verification_policy:
  checked_on: 2026-07-29
  rule: Only primary papers, official challenge pages, and formal reporting or metric recommendations are used for factual claims.
  exclusions:
    - No literature score was imported into an experimental comparison table.
    - No external implementation code was copied.
    - No paper is cited as evidence of clinical applicability for the present study.
