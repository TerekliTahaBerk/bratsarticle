[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bratsarticle"
version = "2.0.0"
description = "Leakage-safe and reproducible BraTS segmentation research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0"}
authors = [
  {name = "Taha Berk Terekli"},
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "matplotlib>=3.9,<4",
  "monai>=1.4,<2",
  "nibabel>=5.3,<6",
  "numpy>=1.26,<3",
  "omegaconf>=2.3,<3",
  "pandas>=2.2,<3",
  "psutil>=6,<8",
  "pyyaml>=6,<7",
  "scikit-image>=0.24,<1",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "surface-distance==0.1",
  "statsmodels>=0.14,<1",
  "tensorboard>=2.18,<3",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]
nnunet = [
  "nnunetv2>=2.5,<3",
]
profiling = [
  "fvcore>=0.1.5",
]

[project.scripts]
brats-data-audit = "bratsarticle.data.audit:main"
brats-generate-split = "bratsarticle.data.splits:main"
brats-train-unet2d = "bratsarticle.training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
  "psutil.*",
  "scipy.*",
  "sklearn.*",
  "statsmodels.*",
  "surface_distance.*",
]
ignore_missing_imports = true
