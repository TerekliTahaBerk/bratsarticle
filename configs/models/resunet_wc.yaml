model:
  name: resunet_plus_wc
  input_channels: 4
  output_channels: 4
  base_channels: 16
  depth: 4
  batch_normalization: true
  dropout_probability: 0.3
  features:
    residual_blocks: true
    residual_extended_skips: false
    wide_context: true
  res:
    kernel_sizes: [9, 11, 13, 15]
  wc:
    kernel_size: 15
  parameter_matching:
    target_parameters: null
    tolerance_fraction: 0.05
  attribution: residual-block U-Net plus BU-Net WC
