schema_version: 1
status: prespecified_rules_only_no_cases_selected
required_wording: Cases selected after evaluation using prespecified deterministic rules.
prohibited_wording: Prespecified cases.
selection_rules:
  - highest_patient_mean_regional_dice
  - median_patient_mean_regional_dice
  - lowest_et_lesion_wise_dice
  - largest_false_positive_lesion_burden
  - largest_regional_hd95
  - largest_pairwise_model_disagreement
tie_breakers:
  - largest_whole_tumor_volume
  - lexicographic_anonymized_patient_id
separate_panels:
  - development_cross_validation
  - external_confirmatory
panel_content:
  - t1
  - t1ce
  - t2
  - flair
  - ground_truth
  - every_main_model
  - false_positive_false_negative_overlay
  - lesion_components
  - slice_index
  - policy_compliant_anonymized_patient_id
cherry_picking: prohibited
selection_before_evaluation: prohibited
