schema_version: 1
status: prespecified_rules_only_no_cases_selected
required_wording: Cases selected after evaluation using prespecified deterministic rules.
prohibited_wording: Prespecified cases.
selection_rules:
  - highest_patient_mean_regional_dice
  - median_patient_mean_regional_dice
  - lowest_et_lesion_wise_dice
  - largest_false_positive_lesion_burden
  - largest_regional_hd95
  - largest_pairwise_model_disagreement
rule_definitions:
  patient_aggregation: arithmetic_mean_across_12_frozen_model_ensemble_rows
  highest_patient_mean_regional_dice: descending patient mean of model-level mean_regional_dice
  median_patient_mean_regional_dice: minimum absolute distance to the cohort median patient mean
  lowest_et_lesion_wise_dice: ascending finite patient mean of et_lesion_wise_dice; patients with no finite value are ineligible
  largest_false_positive_lesion_burden: descending patient mean of the sum of WT, TC, and ET false-positive lesion counts
  largest_regional_hd95: descending patient maximum across models and WT, TC, and ET regional HD95; positive infinity is retained
  largest_pairwise_model_disagreement: descending mean WT, TC, and ET pairwise binary disagreement within the union of reference and all model WT masks
model_prediction_definition: nested-region strict-majority vote across the 25 frozen fold-seed checkpoints
slice_selection: axial slice with largest reference WT area; lowest slice index breaks ties
tie_breakers:
  - largest_whole_tumor_volume
  - lexicographic_anonymized_patient_id
separate_panels:
  - development_cross_validation
  - external_confirmatory
panel_content:
  - t1
  - t1ce
  - t2
  - flair
  - ground_truth
  - every_main_model
  - false_positive_false_negative_overlay
  - lesion_components
  - slice_index
  - policy_compliant_anonymized_patient_id
cherry_picking: prohibited
selection_before_evaluation: prohibited
