schema_version: 1
status: frozen_before_main_results
template: manuscript/q1q2_v2_response_to_reviewer.template.md
policy:
  every_concern_exactly_once: true
  result_numbers_from_claim_registry_only: true
  final_page_and_line_references_after_layout_only: true
  unresolved_limitations_must_remain_visible: true
  legacy_results_cannot_support_v2_responses: true
required_fields:
  - Concern
  - Direct response
  - Exact action
  - New evidence
  - Manuscript location
  - Repository evidence
  - Remaining limitation
concerns:
  - id: R01
    topic: BU-Net attribution and novelty
    status: resolved_in_design_and_template
    evidence:
      - literature/q1q2_verified_sources.yaml
      - configs/q1q2_v2/model_matrix.yaml
      - manuscript/q1q2_v2_manuscript.template.md
  - id: R02
