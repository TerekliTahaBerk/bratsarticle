schema_version: 1
status: frozen_before_first_reportable_development_run
hardware:
  backend: mps
  device: Apple M1 Max
  require_clean_git: true
  deterministic_algorithms: strict
data:
  canonical_manifest: manifests/canonical/brats2020_canonical_manifest.csv
  fold_pattern: splits/q1q2_v2/cv_fold_{fold}.csv
  preprocessing: configs/data/preprocessing_pilot_cached.yaml
  evaluation: configs/q1q2_v2/evaluation.yaml
  training_workers: 0
  validation_workers: 0
  training_batch_size: 16
  validation_batch_size: 16
models:
  matrix: configs/q1q2_v2/model_matrix.yaml
losses:
  catalog: configs/losses/catalog.yaml
  protocol: configs/q1q2_v2/loss_protocol.yaml
training:
  protocol: configs/q1q2_v2/training_protocol.yaml
  convergence_protocol: configs/protocols/convergence_matched_mps.yaml
  learning_rate: 0.0003
  weight_decay: 0.00001
  minimum_learning_rate_fraction: 0.01
  validation_frequency_optimizer_steps: 500
  early_stopping_minimum_delta: 0.001
  early_stopping_patience_validation_checks: 12
  mixed_precision: false
stages:
  loss_screen:
    status: frozen_ready_after_diagnostics
    scientific_role: development_only_loss_selection
    models: [unet_small]
    folds: [1, 2, 3, 4, 5]
    seeds: [20260730]
    losses:
      - cross_entropy_plus_soft_dice
      - binary_cross_entropy_plus_focal_tversky
      - cross_entropy_plus_focal_tversky
    maximum_optimizer_steps: 10000
    warmup_optimizer_steps: 1000
    full_metric_evaluation: false
  main_convergence:
    status: blocked_until_loss_screen_freeze
    scientific_role: reportable_development_cross_validation
    models:
      - unet_small
      - unet_parameter_matched_res
      - unet_compute_matched_res
      - unet_res
      - unet_wc
      - bunet
      - resblock_unet
      - resblock_unet_wc
      - unet_2p5d_k5
    folds: [1, 2, 3, 4, 5]
    seeds: [20260730, 20260731, 20260732, 20260733, 20260734]
    loss: pending_development_cv
    maximum_optimizer_steps: 50000
    warmup_optimizer_steps: 1000
    full_metric_evaluation: true
artifacts:
  root: artifacts/q1q2_v2/native_runs
guards:
  allow_external_data: false
  allow_legacy_internal_test: false
  allow_silent_seed_replacement: false
  require_best_checkpoint: true
  require_terminal_checkpoint: true
