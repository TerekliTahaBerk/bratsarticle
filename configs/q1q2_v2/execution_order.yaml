schema_version: 1
status: bounded_m1_loss_screen_ready
external_inference_permitted: false
legacy_internal_test_inference_permitted: false
ordered_stages:
  - id: unit_tests
    class: nontraining
    status: completed
  - id: synthetic_overfit
    class: training_diagnostic
    status: completed_m1
  - id: one_patient_overfit
    class: training_diagnostic
    status: completed_m1
  - id: single_fold_smoke
    class: training_diagnostic
    status: completed_m1
  - id: single_seed_pilot
    class: reportable_development
    status: loss_screen_queue_frozen_ready
  - id: parameter_compute_search_validation
    class: static_and_runtime_validation
    status: native_runtime_and_nnunet_planning_completed_hardware_preflights_pending
  - id: five_fold_equal_seed_main
    class: reportable_development
    status: queues_prepared_blocked_by_loss_freeze_and_serial_m1_runtime
    required_queues:
      native_configurable_unet: 225
      native_component_compute_matched: 200
      monai_swin_unetr: 25
      official_nnunetv2: 50
  - id: convergence_sensitivity
    class: reportable_development
    status: blocked_by_compute_allocation
  - id: loss_interaction_sensitivity
    class: reportable_development
    status: 100_job_queue_prepared_blocked_by_loss_freeze_and_serial_m1_runtime
  - id: analysis_freeze
    class: irreversible_gate
    status: audit_implemented_pending_loss_and_600_verified_runs
  - id: external_confirmatory_evaluation
    class: one_time_external
    status: guarded_queue_implemented_prohibited_before_analysis_freeze
  - id: robustness
    class: postfreeze_analysis
    status: external_subgroup_pipeline_implemented_development_perturbations_pending
  - id: resource_profiling
    class: postfreeze_analysis
    status: pending
  - id: statistical_analysis
    class: postfreeze_analysis
    status: artifact_only_pipeline_implemented_blocked_by_gate_h
invalid_run_policy:
  block_automatically:
    - external_or_legacy_internal_access_before_analysis_freeze
    - missing_or_mismatched_config_hash
    - missing_or_mismatched_data_hash
    - model_fold_seed_not_in_frozen_matrix
    - nonfinite_loss
    - resource_budget_overrun
    - missing_best_or_terminal_checkpoint
    - silently_replaced_failed_seed
external_failure_policy:
  retuning: prohibited
  rerun_after_model_failure: prohibited
  reporting: report_failure_for_every_frozen_model
